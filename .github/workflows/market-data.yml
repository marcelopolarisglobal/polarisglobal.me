name: Update Market Snapshot

on:
  schedule:
    - cron: '30 22 * * 1-5'  # 22:30 UTC Mon–Fri, após fechamento NYSE
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yfinance
        run: pip install yfinance --quiet

      - name: Fetch market data
        run: python3 scripts/update-snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet || git commit -m "data: update market snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
